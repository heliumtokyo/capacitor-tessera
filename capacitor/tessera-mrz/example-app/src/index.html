<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />
    <title>Tessera MRZ Example</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Capacitor native bridge</p>
      <h1>Tessera MRZ scanner</h1>
      <p class="intro">
        This app exercises the plugin only. Scanning and validation happen on the device; no result is uploaded or
        stored by the example.
      </p>

      <section aria-labelledby="support-title">
        <div class="section-heading">
          <h2 id="support-title">Support</h2>
          <span id="support-status" class="status">Checking…</span>
        </div>
        <pre id="plugin-info">Loading plugin information…</pre>
      </section>

      <section aria-labelledby="scanner-title">
        <h2 id="scanner-title">Passport scan</h2>
        <div class="actions">
          <button id="scan" type="button">Scan passport</button>
          <button id="cancel" class="secondary" type="button">Cancel scanner</button>
        </div>
      </section>

      <section aria-labelledby="result-title">
        <div class="section-heading">
          <h2 id="result-title">Latest result</h2>
          <button id="clear" class="text-button" type="button">Clear</button>
        </div>
        <pre id="result" aria-live="polite">No scan yet.</pre>
      </section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
